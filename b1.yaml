          format: uuid
          example: "019d0b34-5c3e-72b9-a9c3-e3745ebbb5f5"
        code:
          type: string
          minLength: 2
          maxLength: 2
          example: "en"
        name:
          type: string
          example: "English"
        nameLocal:
          type: string
          nullable: true
          example: "الانجليزية"
        isActive:
          type: boolean
          example: true

    LanguageListResponse:
      allOf:
        - $ref: '#/components/schemas/BaseApiResponse'
        - type: object
          properties:
            body:
              type: array
              items:
                $ref: '#/components/schemas/LanguageDto'