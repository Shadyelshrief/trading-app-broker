<section class="details-dialog">
  <header class="details-dialog__header">
    <div>
      <p>Custodian Details</p>
      <h2>{{ data.symbolId }} · {{ data.symbolName }}</h2>
    </div>
    <button mat-stroked-button type="button" mat-dialog-close>Close</button>
  </header>

  <div class="details-dialog__grid">
    <app-market-grid
      [rowData]="(rows$ | async) ?? []"
      [columnDefs]="columns"
      [marketType]="'custodian-details'"
      [stateKey]="'custodian-details-grid-v1'"
      [settings]="settings"
    />
  </div>
</section>
