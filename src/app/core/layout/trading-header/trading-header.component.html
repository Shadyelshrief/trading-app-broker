<header class="trading-header" role="banner">
  <div class="trading-header__ribbon" aria-hidden="true">
    <div class="trading-header__ribbon-track">
      <span>SPX <strong>5,284</strong> +0.42%</span>
      <span>NDX <strong>18,412</strong> +0.61%</span>
      <span>US10Y <strong>4.12%</strong> −0.02</span>
      <span>VIX <strong>14.6</strong> −1.2%</span>
      <span>SPX <strong>5,284</strong> +0.42%</span>
      <span>NDX <strong>18,412</strong> +0.61%</span>
      <span>US10Y <strong>4.12%</strong> −0.02</span>
      <span>VIX <strong>14.6</strong> −1.2%</span>
    </div>
  </div>

  <div class="trading-header__bar">
    <div class="trading-header__left">
      <button
        type="button"
        class="trading-header__icon-btn trading-header__menu-btn"
        aria-label="Open navigation"
        (click)="toggleMobileNav()"
      >
        <app-trading-icon name="grid" />
      </button>

      <div class="trading-header__brand" aria-label="Trading App Broker">
        <span class="trading-header__logo-mark"></span>
        <div class="trading-header__titles">
          <span class="trading-header__product">BrokerOS</span>
          <span class="trading-header__route">{{ routePath() }}</span>
        </div>
      </div>

      <div class="trading-header__market" role="status">
        <span class="trading-header__market-dot" aria-hidden="true"></span>
        <span class="trading-header__market-text">US equities · Regular session</span>
      </div>
    </div>

    <div class="trading-header__center">
      <label class="trading-header__search">
        <span class="trading-header__sr">Command search</span>
        <app-trading-icon name="search" />
        <input type="search" placeholder="Search symbols, clients, commands…" autocomplete="off" />
      </label>
    </div>

    <div class="trading-header__right">
      <div class="trading-header__clock" aria-live="polite">
        <app-trading-icon name="clock" />
        <div>
          <div class="trading-header__time">{{ formatClock(now()) }}</div>
          <div class="trading-header__date">{{ formatSession(now()) }}</div>
        </div>
      </div>

      <label class="trading-header__workspace">
        <span class="trading-header__sr">Workspace</span>
        <select [value]="layout.activeWorkspaceId()" (change)="onWorkspaceSelect($event)">
          @for (ws of workspaces; track ws.id) {
            <option [value]="ws.id">{{ ws.label }}</option>
          }
        </select>
      </label>

      <button
        type="button"
        class="trading-header__icon-btn"
        [attr.aria-pressed]="layout.theme() === 'light'"
        [attr.title]="layout.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        (click)="toggleTheme()"
      >
        <span class="trading-header__theme-glyph" aria-hidden="true">{{ layout.theme() === 'dark' ? '◐' : '◑' }}</span>
      </button>

      <button type="button" class="trading-header__icon-btn" aria-label="Notifications" title="Notifications">
        <app-trading-icon name="bell" />
        <span class="trading-header__badge" aria-hidden="true">0</span>
      </button>

      <div class="trading-header__profile">
        <button
          type="button"
          class="trading-header__profile-trigger"
          [attr.aria-expanded]="profileOpen()"
          aria-haspopup="menu"
          (click)="toggleProfile()"
        >
          <app-trading-icon name="user" />
          <span class="trading-header__chevron" aria-hidden="true">▾</span>
        </button>

        @if (profileOpen()) {
          <div class="trading-header__menu" role="menu">
            <button type="button" role="menuitem" (click)="signOut()">Sign out</button>
          </div>
        }
      </div>
    </div>
  </div>
</header>
