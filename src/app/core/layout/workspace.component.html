<section class="workspace-shell" [class.workspace-shell--subwindow]="subWindow()">
  @if (!subWindow()) {
    <header class="workspace-shell__toolbar">
      <div>
        <p class="workspace-shell__eyebrow">Workspace</p>
        <h3>Golden Layout v2 desktop</h3>
      </div>

      <div class="workspace-shell__actions">
        <p>Drag tabs, resize panes, stack views, or pop them into floating windows.</p>
        <button type="button" (click)="resetLayout()">Reset Layout</button>
      </div>
    </header>
  }

  <div #layoutHost class="workspace-shell__host"></div>
</section>
