@if (vm$ | async; as vm) {
  <section class="module-placeholder-page">
    <div class="module-placeholder-page__card">
      <p class="module-placeholder-page__eyebrow">{{ vm.section | titlecase }}</p>
      <h2>{{ vm.screen | titlecase }}</h2>
      <p>This enterprise module is routed and ready for its dedicated implementation on top of the shared market platform.</p>
    </div>
  </section>
}
