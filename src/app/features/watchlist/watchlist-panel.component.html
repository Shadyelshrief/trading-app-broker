<section class="panel">
  <header class="panel__header">
    <div>
      <p class="panel__eyebrow">Streaming list</p>
      <h4>{{ state()?.title ?? 'Watchlist' }}</h4>
    </div>
    <span class="panel__badge">Live</span>
  </header>

  <ag-grid-angular
    class="panel__grid ag-theme-quartz"
    [modules]="modules"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [rowData]="[]"
    [animateRows]="true"
    [enableCellChangeFlash]="true"
    [asyncTransactionWaitMillis]="120"
    [rowHeight]="40"
    [headerHeight]="36"
    [suppressCellFocus]="true"
    [getRowId]="getRowId"
    (gridReady)="onGridReady($event)"
  />
</section>
