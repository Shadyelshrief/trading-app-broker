<section class="panel">
  <header class="panel__header">
    <div>
      <p class="panel__eyebrow">Execution blotter</p>
      <h4>{{ state()?.title ?? 'Orders' }}</h4>
    </div>

    <div class="panel__summary">
      <span>Open 12</span>
      <span>Filled 4</span>
      <span>Rejected 0</span>
    </div>
  </header>

  <div class="panel__table">
    <div class="panel__row panel__row--head">
      <span>Client</span>
      <span>Side</span>
      <span>Symbol</span>
      <span>Qty</span>
      <span>Status</span>
    </div>

    @for (row of rows; track row.client + row.symbol) {
      <div class="panel__row">
        <span>{{ row.client }}</span>
        <span [class.is-sell]="row.side === 'Sell'">{{ row.side }}</span>
        <strong>{{ row.symbol }}</strong>
        <span>{{ row.qty }}</span>
        <span>{{ row.status }}</span>
      </div>
    }
  </div>
</section>
