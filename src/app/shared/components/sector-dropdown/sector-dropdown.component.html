<mat-form-field appearance="outline" subscriptSizing="dynamic">
  <mat-label>{{ label }}</mat-label>
  <mat-select [disabled]="disabled" [value]="value" (selectionChange)="valueChange.emit($event.value)">
    @if (includeAll) {
      <mat-option [value]="allValue">{{ allLabel }}</mat-option>
    }

    @for (sector of options$ | async; track sector.value) {
      <mat-option [value]="sector.value">{{ sector.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
