<mat-form-field appearance="outline">
  <mat-label>{{ label }}</mat-label>
  <mat-select [disabled]="disabled" [value]="value" (selectionChange)="valueChange.emit($event.value)">
    @if (includeAll) {
      <mat-option [value]="allValue">{{ allLabel }}</mat-option>
    }

    @for (market of markets$ | async; track market.value) {
      <mat-option [value]="market.value">{{ market.label }}</mat-option>
    }
  </mat-select>
</mat-form-field>
