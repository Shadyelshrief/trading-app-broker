@if (vm$ | async; as vm) {
  <section class="full-market-page">
    <section class="full-market-page__toolbar">
      <div class="full-market-page__filters">
        <app-market-dropdown [value]="vm.selectedExchange" (valueChange)="selectExchange($event)" />

        <app-sector-dropdown
          [marketCode]="vm.selectedExchange"
          [value]="vm.selectedSector"
          (valueChange)="selectSector($event)"
        />

        <app-linked-filter-group-control [value]="linkedFilterGroup()" (valueChange)="setLinkedFilterGroup($event)" />

        <mat-form-field appearance="outline" class="full-market-page__search" floatLabel="always" subscriptSizing="dynamic">
          <mat-label>Symbol Search</mat-label>
          <input matInput [formControl]="searchControl" placeholder="Search symbol, company, sector" />
        </mat-form-field>

        <button mat-stroked-button [matMenuTriggerFor]="directionMenu">Direction Filter</button>
        <mat-menu #directionMenu="matMenu">
          <button mat-menu-item (click)="selectDirection('ALL')">All</button>
          <button mat-menu-item (click)="selectDirection('UP')">Rising</button>
          <button mat-menu-item (click)="selectDirection('DOWN')">Falling</button>
          <button mat-menu-item (click)="selectDirection('UNCHANGED')">Unchanged</button>
        </mat-menu>

        <button mat-stroked-button>Export</button>
        <button mat-stroked-button>Layout</button>

        <mat-slide-toggle (change)="toggleAutoScroll($event.checked)">Auto Scroll</mat-slide-toggle>
      </div>

      <div class="full-market-page__counter">{{ vm.totalSymbols }} symbols</div>
      <span class="full-market-page__last-update">Last update: {{ vm.lastUpdatedAt ? (vm.lastUpdatedAt | date: 'HH:mm:ss') : '--' }}</span>
    </section>

    <app-market-grid
      class="full-market-page__grid"
      [rowData]="vm.rows"
      [columnDefs]="columns"
      [contextMenuActions]="menuActions"
      [loading]="vm.loading"
      [marketType]="'full-market'"
      [stateKey]="'full-market-grid-v2-community'"
      [settings]="vm.settings"
      [productDetailsOnSymbolClick]="true"
      (buyOrder)="openOrderTicket('buy', $event)"
      (sellOrder)="openOrderTicket('sell', $event)"
      (priceQuote)="openPriceQuote($event)"
      (depthRequest)="0"
      (chartRequest)="0"
    />
  </section>
}
