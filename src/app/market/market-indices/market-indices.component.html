@if (vm$ | async; as vm) {
  <section class="market-indices">
    <section class="market-indices__toolbar">
      <div class="market-indices__filters">
        <app-market-dropdown
          [includeAll]="true"
          [value]="vm.selectedMarket"
          (valueChange)="selectMarket($event)"
        />
        <app-linked-filter-group-control [value]="linkedFilterGroup()" (valueChange)="setLinkedFilterGroup($event)" />
      </div>

      <span class="market-indices__last-update">Last update: {{ vm.lastUpdated ? (vm.lastUpdated | date: 'HH:mm:ss') : '--' }}</span>
    </section>

    @if (vm.error) {
      <section class="market-indices__error">
        <span>Unable to fully load index data: {{ vm.error }}</span>
      </section>
    }

    <app-market-grid
      class="market-indices__grid"
      [rowData]="vm.rows"
      [columnDefs]="columns"
      [loading]="vm.loading"
      [marketType]="'market-indices'"
      [stateKey]="'market-indices-grid-v1'"
      [settings]="vm.settings"
    />
  </section>
}
