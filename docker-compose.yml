services:
  broker-ui:
    image: shadyelshrief/broker-karepo:latest
    container_name: broker-karepo-ui
    pull_policy: always
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
